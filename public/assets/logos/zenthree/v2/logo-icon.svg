    .bg-plate { fill: #141210; stroke: none; }
    .glyph-dark { display: inline; fill: #F4F2EE; }
    .glyph-light { display: none; fill: #141210; }

    /* Light System Mode Override */
    @media (prefers-color-scheme: light) {
      .bg-plate { fill: #FFFFFF; stroke: #E3E1DC; stroke-width: 2px; }
