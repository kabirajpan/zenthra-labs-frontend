      .glyph-light { display: inline; fill: #141210; }
    }

    /* Explicit Dark System Mode */
    @media (prefers-color-scheme: dark) {
      .bg-plate { fill: #141210; stroke: none; }
      .glyph-dark { display: inline; fill: #F4F2EE; }
      .glyph-light { display: none; }
    }
  </style>

